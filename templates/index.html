<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVREA Global Measures Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400&family=Roboto+Slab:wght@300;400;500;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --pv-blue:#005A9C;      /* primary dark blue */
  --pv-red:#D73647;       /* primary red */
  --pv-ltblue:#00A8CD;    /* secondary light blue */
  --pv-gold:#F8991D;      /* secondary gold */
  --pv-green:#008457;     /* secondary dark green */
  --pv-ltgreen:#7DB045;   /* secondary light green */
  --pv-gray:#808285;      /* secondary gray */
  --met:#008457; --track:#00A8CD; --jeopardy:#F8991D; --off:#D73647; --nodata:#B9BBBD;
  --ink:#22252a; --line:#e4e6e9; --bg:#f4f6f8; --card:#ffffff;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Roboto',Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
h1,h2,h3,h4,.slab{font-family:'Roboto Slab','Roboto',serif}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- Header w/ brand angular block ---------- */
header{position:relative;background:var(--pv-blue);color:#fff;overflow:hidden}
header .angular{position:absolute;top:0;right:0;height:100%;width:46%;
  background:linear-gradient(115deg,transparent 0,transparent 38%,var(--pv-ltblue) 38%,var(--pv-ltblue) 55%,var(--pv-green) 55%,var(--pv-green) 70%,var(--pv-gold) 70%);
  clip-path:polygon(28% 0,100% 0,100% 100%,0 100%);opacity:.9}
.hd-inner{position:relative;z-index:2;max-width:1400px;margin:0 auto;padding:20px 26px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.brand-mark{display:flex;align-items:center;gap:16px}
.pv-logo{background:#fff;padding:8px 14px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center}
.pv-logo img{height:44px;display:block}
.hd-title h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.2px}
.hd-title p{margin:2px 0 0;font-size:12.5px;opacity:.9;font-family:'Roboto'}
.hd-actions{display:flex;gap:8px;flex-wrap:wrap;z-index:3}
.hd-actions button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);padding:8px 12px;border-radius:6px;font-size:12.5px;font-weight:500;transition:.15s}
.hd-actions button:hover{background:#fff;color:var(--pv-blue)}
.ds-bar{position:relative;z-index:3;max-width:1400px;margin:0 auto;padding:0 26px 12px;display:flex;align-items:center;gap:14px}
.ds-status{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600}
.ds-dot{width:9px;height:9px;border-radius:50%;background:#808285;box-shadow:0 0 0 3px rgba(255,255,255,.15);transition:.2s}
.ds-refresh{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600}
.ds-refresh:hover{background:#fff;color:var(--pv-blue)}

/* ---------- Controls bar ---------- */
.controls{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.04)}
.controls-inner{max-width:1400px;margin:0 auto;padding:12px 26px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ctl-group{display:flex;align-items:center;gap:8px}
.ctl-group label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--pv-gray)}
select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff;color:var(--ink);min-width:110px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid;background:#fff;transition:.12s;user-select:none}
.chip.on{color:#fff}
.legend{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:11.5px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px;font-weight:600;color:#555}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}

/* ---------- Main ---------- */
main{max-width:1400px;margin:0 auto;padding:22px 26px 60px}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}
.scard{background:var(--card);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow);border-top:4px solid;position:relative}
.scard .num{font-family:'Roboto Slab';font-size:34px;font-weight:700;line-height:1}
.scard .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--pv-gray);font-weight:700;margin-top:4px}
.scard .sub{font-size:11px;color:#9a9da1;margin-top:2px}

/* ---------- Pillar sections ---------- */
.pillar{background:var(--card);border-radius:12px;box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.pillar-head{padding:12px 18px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.pillar-head h2{margin:0;font-size:17px;font-weight:700}
.pillar-head .pmeta{font-size:12px;opacity:.92;font-weight:600;font-family:'Roboto'}
.measure-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:16px 18px}
.mcard{border:1px solid var(--line);border-radius:9px;padding:14px;position:relative;transition:.15s;background:#fff;border-left:5px solid var(--nodata)}
.mcard:hover{box-shadow:0 4px 16px rgba(0,0,0,.09);transform:translateY(-1px)}
.mcard .mname{font-weight:600;font-size:13.5px;margin-bottom:10px;min-height:36px;line-height:1.3}
.mcard .vals{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.mcard .actual{font-family:'Roboto Slab';font-size:26px;font-weight:700;line-height:1}
.mcard .goal{font-size:12px;color:var(--pv-gray);text-align:right}
.mcard .goal b{display:block;font-size:14px;color:var(--ink);font-family:'Roboto Slab'}
.pill-row{display:flex;justify-content:flex-end;margin-bottom:8px}
.status-pill{display:inline-block;max-width:100%;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 8px;border-radius:12px;color:#fff;white-space:nowrap}
.prog{position:relative;height:8px;border-radius:4px;background:#eef0f2;margin-top:12px;overflow:visible}
.prog i{display:block;height:100%;border-radius:4px;transition:width .3s ease}
.prog .pace{position:absolute;top:-2px;bottom:-2px;width:2px;background:#22252a;opacity:.6;border-radius:2px;transform:translateX(-50%);pointer-events:none}
.trend{margin-top:8px;font-size:11px;color:#8a8d91;display:flex;gap:6px;align-items:center}
.trend b{font-family:'Roboto Slab'}

/* ---------- Chatbot ---------- */
#chatFab{position:fixed;bottom:22px;right:22px;z-index:60;width:116px;height:116px;
  background:none;border:none;border-radius:0;padding:0;box-shadow:none;
  display:flex;align-items:center;justify-content:center;overflow:visible;
  transition:filter .18s ease,transform .15s ease;
  filter:drop-shadow(0 0 3px rgba(0,0,0,.85))
         drop-shadow(0 0 9px rgba(0,0,0,.55))
         drop-shadow(0 0 20px rgba(0,0,0,.35));}
#chatFab img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
#chatFab:hover{background:none;box-shadow:none;transform:scale(1.06);
  filter:drop-shadow(0 0 4px rgba(0,0,0,.95))
         drop-shadow(0 0 12px rgba(0,0,0,.65))
         drop-shadow(0 0 26px rgba(0,0,0,.45));}
#chatPanel{position:fixed;bottom:150px;right:22px;z-index:60;width:380px;max-width:calc(100vw - 44px);height:520px;max-height:calc(100vh - 130px);background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden}
.chat-head{background:var(--pv-blue);color:#fff;padding:13px 16px;display:flex;justify-content:space-between;align-items:center}
.chat-head b{font-family:'Roboto Slab';font-size:15px}
.chat-head small{opacity:.85;font-size:11px}
.chat-head button{background:transparent;border:none;color:#fff;font-size:18px}
.chat-body{flex:1;overflow-y:auto;padding:14px;background:#f7f9fb;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.4;white-space:pre-wrap}
.msg.bot{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:3px}
.msg.user{background:var(--pv-blue);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.msg.bot table{border-collapse:collapse;margin-top:6px;font-size:11.5px;width:100%}
.msg.bot td,.msg.bot th{border:1px solid var(--line);padding:3px 6px;text-align:left}
.msg.bot th{background:#eef2f5}
.chat-suggest{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;background:#fff;border-top:1px solid var(--line);max-height:104px;overflow-y:auto}
.chat-suggest button{font-size:11px;background:#eef2f5;border:1px solid var(--line);border-radius:14px;padding:5px 10px;color:var(--pv-blue);font-weight:600}
.chat-input{display:flex;border-top:1px solid var(--line);padding:10px}
.chat-input input{flex:1;border:1px solid var(--line);border-radius:20px;padding:9px 14px;font-size:13px;outline:none}
.chat-input button{margin-left:8px;background:var(--pv-red);color:#fff;border:none;border-radius:20px;padding:0 16px;font-weight:700}

.footer-note{text-align:center;color:#9a9da1;font-size:11.5px;margin-top:30px}
/* ---------- Report overlay (fallback when pop-ups are blocked / sandboxed preview) ---------- */
#reportOverlay{position:fixed;inset:0;z-index:200;background:rgba(20,25,32,.55);display:flex;flex-direction:column;align-items:center;padding:24px;overflow:auto}
#reportOverlay .ro-toolbar{width:100%;max-width:8.7in;display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}
#reportOverlay .ro-toolbar button{border:none;border-radius:6px;padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer}
#reportOverlay .ro-print{background:#D73647;color:#fff}
#reportOverlay .ro-open{background:#005A9C;color:#fff}
#reportOverlay .ro-close{background:#fff;color:#22252a;border:1px solid #cfd5da!important}
#reportOverlay .ro-frame{width:100%;max-width:8.7in;flex:1;min-height:70vh;background:#fff;border:none;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.4)}

@media(max-width:900px){.summary{grid-template-columns:repeat(2,1fr)}}
@media print{body{background:#fff}.controls,header .hd-actions,#chatFab,#chatPanel{display:none!important}}
</style>
</head>
<body>
<header>
  <div class="angular"></div>
  <div class="hd-inner">
    <div class="brand-mark">
      <div class="pv-logo"><img src="/static/logo.jpg" alt="Poudre Valley REA"></div>
      <div class="hd-title">
        <h1>Global Measures Scorecard</h1>
        <p>Strategic performance tracking &middot; 2024&ndash;2030</p>
      </div>
    </div>
    <div class="hd-actions">
      <button onclick="Report.executive()">&#128202; Executive Report</button>
      <button onclick="Report.onepage()">&#128196; One-Page</button>
      <button onclick="Report.concerns()">&#9888;&#65039; Concerns</button>
      <button onclick="Report.pillar()">&#127942; Pillar Scorecard</button>
      <button onclick="Report.trend()">&#128200; Year-over-Year</button>
    </div>
  </div>
  <div class="ds-bar">
    <div id="dsStatus" class="ds-status"><span class="ds-dot"></span><span class="ds-text">Initializing&hellip;</span></div>
    <button class="ds-refresh" onclick="Data.refresh()" title="Re-query dbo.GlobalMeasures through the Flask API">&#8635; Refresh live data</button>
  </div>
</header>

<div class="controls">
  <div class="controls-inner">
    <div class="ctl-group">
      <label>Year</label>
      <select id="yearSel" onchange="App.render()"></select>
    </div>
    <div class="ctl-group">
      <label>Compare</label>
      <select id="cmpSel" onchange="App.render()">
        <option value="">Prior year</option>
      </select>
    </div>
    <div class="ctl-group">
      <label>Status</label>
      <select id="statusSel" onchange="App.render()">
        <option value="">All statuses</option>
        <option value="met">Goal Met</option>
        <option value="track">Tracking to Meet</option>
        <option value="jeopardy">In Jeopardy</option>
        <option value="off">Missed / Off Track</option>
        <option value="nodata">No Data / Planned</option>
      </select>
    </div>
    <div class="ctl-group">
      <label>Pillars</label>
      <div class="chips" id="pillarChips"></div>
    </div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<main>
  <div class="summary" id="summary"></div>
  <div id="pillars"></div>
  <div class="footer-note" id="footNote"></div>
</main>

<button id="chatFab" onclick="Chat.toggle()" title="Ask the data"><img src="/static/wattsworth.png" alt="Wattsworth AI Assistant"></button>
<div id="chatPanel" class="hidden">
  <div class="chat-head">
    <div><b>Flash the Fact Finder</b><br><small>Ask me anything about the data</small></div>
    <button onclick="Chat.toggle()">&times;</button>
  </div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-suggest" id="chatSuggest"></div>
  <div class="chat-input">
    <input id="chatInput" placeholder="e.g. what's in jeopardy in 2026?" onkeydown="if(event.key==='Enter')Chat.send()">
    <button onclick="Chat.send()">Send</button>
  </div>
</div>

/* ============ STATUS ENGINE ============ */
const Engine = (function(){
  const STATUS = {
    met:     {key:'met',      label:'Goal Met',          color:'var(--met)',      hex:'#008457'},
    track:   {key:'track',    label:'Tracking to Meet',  color:'var(--track)',    hex:'#00A8CD'},
    jeopardy:{key:'jeopardy', label:'In Jeopardy',       color:'var(--jeopardy)', hex:'#F8991D'},
    off:     {key:'off',      label:'Missed / Off Track',color:'var(--off)',      hex:'#D73647'},
    nodata:  {key:'nodata',   label:'No Data / Planned', color:'var(--nodata)',   hex:'#B9BBBD'}
  };
  function parseNum(s){
    if(s==null) return null;
    // strip thousands separators ("1,554" -> "1554") but keep dual values ("174 , 29")
    s=String(s).trim().replace(/(\d),(?=\d{3}(\D|$))/g,'$1');
    if(/\d(st|nd|rd|th)\b/i.test(s)) return {ordinal:s.toLowerCase()};
    const first=s.split(',')[0];
    const pct=/%/.test(first);
    const n=parseFloat(first.replace(/[^0-9.\-]/g,''));
    if(isNaN(n)) return null;
    return {value:n,pct};
  }
  function parseGoal(g){
    if(g==null) return null;
    g=String(g).trim().replace(/(\d),(?=\d{3}(\D|$))/g,'$1');
    if(/\d(st|nd|rd|th)\b/i.test(g)) return {ordinal:g.toLowerCase(),op:'='};
    let op='>=';
    if(/^≤|<=/.test(g)) op='<=';
    else if(/^</.test(g)) op='<';
    else if(/^≥|>=/.test(g)) op='>=';
    else if(/^>/.test(g)) op='>';
    else op='none';
    const first=g.split(',')[0];
    const pct=/%/.test(first);
    const n=parseFloat(first.replace(/[^0-9.\-]/g,''));
    if(isNaN(n)) return null;
    return {value:n,op,pct};
  }
  /* ---- time-of-year context ---- */
  const NOW = new Date();
  function yearFraction(year){
    // Fraction of the given calendar year elapsed as of today.
    // Past years = 1 (complete); future years = 0 (not started); current year = elapsed %.
    const y = NOW.getFullYear();
    if(year < y) return 1;
    if(year > y) return 0;
    const start = new Date(year,0,1), end = new Date(year+1,0,1);
    return Math.max(0, Math.min(1, (NOW - start)/(end - start)));
  }
  // Cumulative "count up over the year" measures should be judged against pace-to-date
  // (not the full-year target) while the year is still in progress.
  function isCumulative(measure){
    return /inspection|presentation|advocate/i.test(String(measure||''));
  }
  function paceStatus(ratio, paceRatio){
    // ratio = attainment vs full-year goal; paceRatio = attainment vs expected-to-date
    if(ratio>=1) return STATUS.met;
    return paceRatio>=0.95?STATUS.track : paceRatio>=0.75?STATUS.jeopardy : STATUS.off;
  }
  function evaluate(rec){
    const a=parseNum(rec.actual), g=parseGoal(rec.goal);
    if(a==null||g==null) return {status:STATUS.nodata,pct:null,pace:null};
    // ordinal comparison
    if(a.ordinal||g.ordinal){
      const ok = a.ordinal && g.ordinal && a.ordinal===g.ordinal;
      return {status: ok?STATUS.met:STATUS.off, pct: ok?1:0, pace:null};
    }
    let av=a.value, gv=g.value, op=g.op;
    // normalise percent stored as decimal
    if(g.pct && av<=1.5 && av>0 && gv>1) av=av*100;
    // determine direction
    let lowerBetter = (op==='<='||op==='<');
    if(op==='none'){ lowerBetter = (gv===0); }
    const yf = yearFraction(rec.year);
    const inProgress = yf>0 && yf<1;              // this year is currently underway
    let ratio, ok;
    if(gv===0){
      ok = av<=0.0001;
      return {status: ok?STATUS.met:STATUS.off, pct: ok?1:0, pace:null, disp:{av,gv}};
    }
    if(lowerBetter){
      ratio = av/gv; ok = av<=gv;
      let st = ok?STATUS.met : ratio<=1.15?STATUS.track : ratio<=1.35?STATUS.jeopardy : STATUS.off;
      // Progress bar: full when comfortably under the cap, draining toward 0 at ~2x the cap.
      let pct = ok ? 1 : Math.max(0, Math.min(1, 2-ratio));
      return {status:st, pct, ratio, pace:null, disp:{av,gv}};
    } else {
      ratio = av/gv; ok = av>=gv;
      if(inProgress && isCumulative(rec.measure)){
        // Judge cumulative counts against the pace they *should* be at by today.
        const paceRatio = ratio/(yf||1);
        const st = paceStatus(ratio, paceRatio);
        return {status:st, pct: Math.max(0,Math.min(1,ratio)), ratio, pace: Math.max(0,Math.min(1,yf)), paceRatio, disp:{av,gv}};
      }
      let st = ok?STATUS.met : ratio>=0.9?STATUS.track : ratio>=0.75?STATUS.jeopardy : STATUS.off;
      return {status:st, pct: Math.max(0,Math.min(1,ratio)), ratio, pace:null, disp:{av,gv}};
    }
  }
  // Wrap evaluate so EVERY measured bar exposes a tick position:
  //  - cumulative goals mid-year -> pro-rated "expected pace" tick (set inside evaluate)
  //  - everything else with data  -> a "goal line" tick at 100%
  function evaluateWithTick(rec){
    const ev = evaluate(rec);
    if(ev.pct!=null){
      if(ev.pace==null){ ev.pace = 1; ev.paceKind = 'goal'; }
      else { ev.paceKind = 'pace'; }
    }
    return ev;
  }
  return {evaluate:evaluateWithTick,STATUS,parseNum,parseGoal};
})();

/* ============ DATA HELPERS ============ */
function recFor(measure,year){ return DB.records.find(r=>r.measure===measure&&r.year===year); }
function measuresIn(section){ const s=new Set(); DB.records.filter(r=>r.section===section).forEach(r=>s.add(r.measure)); return [...s]; }
function fmtActual(rec){
  if(rec.actual==null) return '&mdash;';
  const a=Engine.parseNum(rec.actual);
  if(a&&a.pct && a.value<=1.5){ return (a.value*100).toFixed(1).replace(/\.0$/,'')+'%'; }
  return rec.actual;
}

    let best=null;
    DB.records.forEach(r=>{ if(r.actual!=null){ if(best==null||r.year>best) best=r.year; } });
    return best!=null?best:DB.years[DB.years.length-1];
  }
  function rebuildYears(){
    const ys=document.getElementById('yearSel'), cs=document.getElementById('cmpSel');
    const prevY=ys.value, prevC=cs.value;
    ys.innerHTML=''; cs.innerHTML='<option value="">Prior year</option>';
    DB.years.forEach(y=>{ ys.innerHTML+=`<option value="${y}">${y}</option>`; });
    DB.years.forEach(y=>{ cs.innerHTML+=`<option value="${y}">${y}</option>`; });
    // preserve prior selection if still valid, else default to latest year with actuals
    ys.value = (prevY && DB.years.includes(parseInt(prevY))) ? prevY : latestYearWithData();
    if(prevC && DB.years.includes(parseInt(prevC))) cs.value=prevC;
  }
  function reload(){ rebuildYears(); render(); }
  function initControls(){
    rebuildYears();
    // chips
    const cc=document.getElementById('pillarChips');
    DB.sectionOrder.forEach(s=>{
      const c=DB.pillarColors[s];
      const el=document.createElement('div');
      el.className='chip on'; el.textContent=s.replace('Performance','Perf.');
      el.style.borderColor=c; el.style.background=c;
      el.onclick=()=>{ if(activePillars.has(s)){activePillars.delete(s);el.classList.remove('on');el.style.background='#fff';el.style.color=c;} else {activePillars.add(s);el.classList.add('on');el.style.background=c;el.style.color='#fff';} render(); };
      cc.appendChild(el);
    });
    // legend
    const lg=document.getElementById('legend');
    Object.values(Engine.STATUS).forEach(s=>{ lg.innerHTML+=`<span><i class="dot" style="background:${s.hex}"></i>${s.label}</span>`; });
  }
  function currentYear(){ return parseInt(document.getElementById('yearSel').value); }
  function compareYear(){ const v=document.getElementById('cmpSel').value; return v?parseInt(v):currentYear()-1; }
  function render(){
    const year=currentYear(), cmp=compareYear(), stFilter=document.getElementById('statusSel').value;
    // summary counts
    const counts={met:0,track:0,jeopardy:0,off:0,nodata:0};
    const rows=[];
    DB.sectionOrder.filter(s=>activePillars.has(s)).forEach(sec=>{
      measuresIn(sec).forEach(m=>{
        const r=recFor(m,year); if(!r)return;
        const ev=Engine.evaluate(r);
        counts[ev.status.key]++;
        rows.push({sec,m,r,ev});
      });
    });
    renderSummary(counts,year);
    // pillars
    const wrap=document.getElementById('pillars'); wrap.innerHTML='';
    DB.sectionOrder.filter(s=>activePillars.has(s)).forEach(sec=>{
      const c=DB.pillarColors[sec];
      let cards='';
      let shown=0, secCounts={met:0,track:0,jeopardy:0,off:0,nodata:0};
      measuresIn(sec).forEach(m=>{
        const r=recFor(m,year); if(!r)return;
        const ev=Engine.evaluate(r); secCounts[ev.status.key]++;
        if(stFilter && ev.status.key!==stFilter) return;
        shown++;
        const cr=recFor(m,cmp);
        let trend='';
        if(cr&&cr.actual!=null&&r.actual!=null){
          const pa=Engine.parseNum(r.actual), pb=Engine.parseNum(cr.actual);
          if(pa&&pb&&pa.value!=null&&pb.value!=null){
            const diff=pa.value-pb.value;
            const arrow=diff>0?'&#9650;':diff<0?'&#9660;':'&#9644;';
            trend=`<div class="trend">${arrow} vs ${cmp}: <b>${cr.actual}</b></div>`;
          }
        }
        cards+=`<div class="mcard" style="border-left-color:${ev.status.hex}">
          <div class="mname">${m}</div>
          <div class="pill-row"><span class="status-pill" style="background:${ev.status.hex}">${ev.status.label}</span></div>
          <div class="vals">
            <div><div style="font-size:10px;color:#9a9da1;text-transform:uppercase;letter-spacing:.5px;font-weight:700">Current</div>
              <div class="actual" style="color:${ev.status.hex}">${fmtActual(r)}</div></div>
            <div class="goal">Goal<b>${r.goal||'&mdash;'}</b></div>
          </div>
          <div class="prog" title="${ev.pct!=null?Math.round(ev.pct*100)+'% of goal':'No data'}${ev.pace!=null?(ev.paceKind==='pace'?' · expected '+Math.round(ev.pace*100)+'% by today':' · tick = goal line'):''}"><i style="width:${ev.pct!=null?Math.round(ev.pct*100):0}%;background:${ev.status.hex}"></i>${ev.pace!=null?`<span class="pace" style="left:${Math.round(ev.pace*100)}%" title="${ev.paceKind==='pace'?'Expected pace by today ('+Math.round(ev.pace*100)+'%)':'Goal line (100%)'}"></span>`:''}</div>
          ${trend}
        </div>`;
      });
      if(stFilter && shown===0) return;
      const total=measuresIn(sec).length;
      wrap.innerHTML+=`<div class="pillar">
        <div class="pillar-head" style="background:${c}">
          <h2>${sec}</h2>
          <div class="pmeta">${secCounts.met} met &middot; ${secCounts.track} tracking &middot; ${secCounts.jeopardy+secCounts.off} at risk</div>
        </div>
        <div class="measure-grid">${cards}</div>
      </div>`;
    });
    const asOf=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    const tickNote = year===new Date().getFullYear()
      ? ` &middot; The &#9474; tick marks expected pace-to-date for in-progress cumulative goals (as of ${asOf}), or the goal line for other measures`
      : ` &middot; The &#9474; tick marks the goal line`;
    document.getElementById('footNote').innerHTML=`Showing ${year} performance vs ${cmp} &middot; Data source: <b>Azure SQL &middot; dbo.GlobalMeasures</b> (${DB.records.length} records) &middot; Colors &amp; type per PVREA Brand Standards Guide${tickNote}`;
  }
  function renderSummary(counts,year){
    const total=counts.met+counts.track+counts.jeopardy+counts.off+counts.nodata;
    const withData=total-counts.nodata;
    const cfg=[
      {n:counts.met,l:'Goals Met',c:'#008457',s:withData?Math.round(counts.met/withData*100)+'% of measured':''},
      {n:counts.track,l:'Tracking to Meet',c:'#00A8CD',s:'within reach'},
      {n:counts.jeopardy,l:'In Jeopardy',c:'#F8991D',s:'need attention'},
      {n:counts.off,l:'Missed / Off Track',c:'#D73647',s:'below target'},
      {n:counts.nodata,l:'Planned / No Data',c:'#808285',s:'future years'}
    ];
    document.getElementById('summary').innerHTML=cfg.map(x=>
      `<div class="scard" style="border-top-color:${x.c}">
        <div class="num" style="color:${x.c}">${x.n}</div>
        <div class="lbl">${x.l}</div><div class="sub">${x.s}</div></div>`).join('');
  }
  return {initControls,render,reload,currentYear,compareYear,
    activeSections:()=>DB.sectionOrder.filter(s=>activePillars.has(s)),
    statusFilter:()=>document.getElementById('statusSel').value};
})();

/* ============ REPORTS (print windows) ============ */
const Report=(function(){
  const CSS=`<style>

  </style>`;
  function buildDoc(title,inner){
    return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${title}</title>${CSS}</head>
      <body><div class="sheet">${inner}<div class="foot">Poudre Valley REA &middot; Generated ${new Date().toLocaleDateString()} &middot; Source: Azure SQL &middot; dbo.GlobalMeasures &middot; Confidential</div></div></body></html>`;
  }
  function open(title,inner){
    const html=buildDoc(title,inner);
    const oldFrame=document.getElementById('reportPrintFrame');
    if(oldFrame) oldFrame.remove();

    // Load only the selected report in an invisible iframe, then open the
    // browser's print dialog immediately. No new tab or second print button.
    const frame=document.createElement('iframe');
    frame.id='reportPrintFrame';
    frame.title=title;
    frame.style.position='fixed';
    frame.style.right='0';
    frame.style.bottom='0';
    frame.style.width='1px';
    frame.style.height='1px';
    frame.style.border='0';
    frame.style.opacity='0';
    frame.style.pointerEvents='none';
    document.body.appendChild(frame);

    frame.onload=()=>{
      try{
        const printWindow=frame.contentWindow;
        printWindow.focus();
        setTimeout(()=>printWindow.print(),150);
      }catch(e){
        console.error('Unable to open the report print dialog.',e);
        showOverlay(title,html);
      }
    };
    frame.srcdoc=html;
  }
  function showOverlay(title,html){

      <div class="ro-toolbar">
        <button class="ro-print" title="Print or save as PDF">&#128424; Print / Save PDF</button>
        <button class="ro-open" title="Open in a new browser tab">&#8599; Open in new tab</button>
