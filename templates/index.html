      </div>
      <iframe class="ro-frame" title="${title}"></iframe>`;
    document.body.appendChild(ov);
    const frame=ov.querySelector('.ro-frame');
    // Write the report into the iframe via srcdoc (works in sandboxed previews).
    frame.srcdoc=html;
    // Print just the report iframe.
    ov.querySelector('.ro-print').onclick=()=>{
      try{ frame.contentWindow.focus(); frame.contentWindow.print(); }
      catch(e){ window.print(); }
    };
    // Offer a real new tab via a Blob URL (works where pop-ups are allowed).
    ov.querySelector('.ro-open').onclick=()=>{
      try{
        const blob=new Blob([html],{type:'text/html'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url; a.target='_blank'; a.rel='noopener';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),60000);
      }catch(e){ alert('Your browser blocked opening a new tab. Use Print / Save PDF instead.'); }
    };
    const close=()=>ov.remove();
    ov.querySelector('.ro-close').onclick=close;
    ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
    document.addEventListener('keydown',function esc(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown',esc); } });
  }
  function header(sub){
    return `<div class="rhead"><div class="ang"></div><span class="logo">PVREA</span>
      <h1>${sub.title}</h1><p>${sub.sub}</p></div>`;
  }
  /* ----- selection helpers (read live from the web page) ----- */
  function sections(){ return App.activeSections(); }              // respects pillar chips
  function stFilter(){ return App.statusFilter(); }                // respects status dropdown
  function applyStatus(rows){ const f=stFilter(); return f?rows.filter(x=>x.ev.status.key===f):rows; }
  function filterBanner(y){
    const cmp=App.compareYear(), stf=stFilter(), secs=sections();
    const pillLbl = secs.length===DB.sectionOrder.length ? 'All pillars' : (secs.length?secs.join(', '):'None selected');
    const stLbl = stf ? Engine.STATUS[stf].label : 'All statuses';
    return `<div class="fbar"><b>Report reflects your dashboard selections</b>
      <span class="ftag">Year: ${y}</span>
      <span class="ftag">Compare: ${cmp}</span>
      <span class="ftag">Status: ${stLbl}</span>
      <span class="ftag">Pillars: ${pillLbl}</span></div>`;
  }
  function gather(year){
    const rows=[];
    sections().forEach(sec=>measuresIn(sec).forEach(m=>{
      const r=recFor(m,year); if(!r)return; rows.push({sec,m,r,ev:Engine.evaluate(r)});
    }));
    return rows;
  }
  function badge(ev){return `<span class="badge" style="background:${ev.status.hex}">${ev.status.label}</span>`;}
  function trendCell(m,year,cmp){
    const cr=recFor(m,cmp), r=recFor(m,year);
    if(!cr||cr.actual==null||!r||r.actual==null) return '<td style="color:#c3c5c8">&mdash;</td>';
    const pa=Engine.parseNum(r.actual), pb=Engine.parseNum(cr.actual);
    if(!pa||!pb||pa.value==null||pb.value==null) return `<td>${cr.actual}</td>`;
    const diff=pa.value-pb.value;
    const arrow=diff>0?'&#9650;':diff<0?'&#9660;':'&#9644;';
    return `<td>${arrow} ${cr.actual}</td>`;
  }
  function rowsTable(list,showSec=true,year=null,cmp=null){
    const showCmp = cmp!=null && year!=null;
    let h=`<table><tr>${showSec?'<th>Pillar</th>':''}<th>Measure</th><th>Current</th><th>Goal</th>${showCmp?`<th>vs ${cmp}</th>`:''}<th>Status</th></tr>`;
    list.forEach(x=>{h+=`<tr>${showSec?`<td><span class="pill-strip" style="background:${x.r.color}"></span>${x.sec}</td>`:''}<td>${x.m}</td><td>${x.r.actual??'&mdash;'}</td><td>${x.r.goal??'&mdash;'}</td>${showCmp?trendCell(x.m,year,cmp):''}<td>${badge(x.ev)}</td></tr>`;});
    return h+'</table>';
  }
  function counts(rows){const c={met:0,track:0,jeopardy:0,off:0,nodata:0};rows.forEach(x=>c[x.ev.status.key]++);return c;}
  /* ----- Executive summary block (shared by every report) ----- */
  function pctOf(n,d){ return d?Math.round(n/d*100):0; }
  function execSummary(y,cmp){
    const stf=stFilter(), secs=sections();
    const rows=gather(y), c=counts(rows), wd=rows.length-c.nodata;
    const rate=pctOf(c.met,wd), atRisk=c.jeopardy+c.off;
    const scope = secs.length===DB.sectionOrder.length ? 'all five pillars' : `${secs.length} selected pillar${secs.length===1?'':'s'}`;

    /* --- prior-period attainment for a year-over-year headline --- */
    const prior=[]; secs.forEach(sec=>measuresIn(sec).forEach(m=>{
      const r=recFor(m,cmp); if(r) prior.push({m,r,ev:Engine.evaluate(r)});
    }));
    const pc=counts(prior), pwd=prior.length-pc.nodata, prate=pctOf(pc.met,pwd);
    let yoy;
    if(!pwd) yoy=`No comparable ${cmp} actuals are on file, so no year-over-year attainment shift is available.`;
    else{
      const d=rate-prate;
      const dir = d>0?`up ${d} pts from`: d<0?`down ${Math.abs(d)} pts from`:`flat against`;
      yoy=`Attainment is <b>${dir}</b> ${cmp} (${prate}% of ${pwd} measured).`;
    }

    /* --- strongest / weakest pillar by attainment rate --- */
    const pillarStats=secs.map(sec=>{
      const list=measuresIn(sec).map(m=>recFor(m,y)).filter(Boolean).map(r=>({ev:Engine.evaluate(r)}));
      const cc=counts(list.map(x=>({ev:x.ev}))), w=list.length-cc.nodata;
      return {sec,w,met:cc.met,risk:cc.jeopardy+cc.off,rate:pctOf(cc.met,w)};
    }).filter(p=>p.w>0);
    const best=pillarStats.slice().sort((a,b)=>b.rate-a.rate||b.w-a.w)[0];
    const worst=pillarStats.slice().sort((a,b)=>b.risk-a.risk||a.rate-b.rate)[0];

    /* --- biggest movers by change in goal attainment vs the comparison year --- */
    const movers=[];
    secs.forEach(sec=>measuresIn(sec).forEach(m=>{
      const a=recFor(m,y), b=recFor(m,cmp);
      if(!a||!b||a.actual==null||b.actual==null) return;
      const ea=Engine.evaluate(a), eb=Engine.evaluate(b);
      if(ea.pct==null||eb.pct==null) return;
      movers.push({sec,m,delta:ea.pct-eb.pct,now:a.actual,then:b.actual});
    }));
    movers.sort((a,b)=>b.delta-a.delta);
    const up=movers[0], down=movers[movers.length-1];

    /* --- named measures needing leadership attention --- */
    const attn=rows.filter(x=>x.ev.status.key==='off')
                   .concat(rows.filter(x=>x.ev.status.key==='jeopardy'));
    const attnNames=attn.slice(0,3).map(x=>`${x.m} (${x.r.actual??'—'} vs ${x.r.goal??'—'})`).join('; ');

    let hits=`<li><b>Attainment:</b> ${c.met} of ${wd} measured goals met (<b>${rate}%</b>); ${c.track} tracking to meet.</li>
      <li><b>Year over year:</b> ${yoy}</li>`;
    if(best) hits+=`<li><b>Strongest pillar:</b> ${best.sec} &mdash; ${best.met}/${best.w} met (${best.rate}%).</li>`;
    if(worst&&worst.risk>0) hits+=`<li><b>Most exposure:</b> ${worst.sec} &mdash; ${worst.risk} measure${worst.risk===1?'':'s'} at risk.</li>`;
    if(up&&up.delta>0) hits+=`<li><b>Biggest gain vs ${cmp}:</b> ${up.m} &mdash; ${up.then} &rarr; ${up.now}.</li>`;
    if(down&&down.delta<0) hits+=`<li><b>Largest slide vs ${cmp}:</b> ${down.m} &mdash; ${down.then} &rarr; ${down.now}.</li>`;
    if(attnNames) hits+=`<li><b>Watch list:</b> ${attnNames}${attn.length>3?`, plus ${attn.length-3} more`:''}.</li>`;
    hits+=`<li><b>Pipeline:</b> ${c.nodata} measure${c.nodata===1?'':'s'} planned for future years and not yet reporting.</li>`;

    return `<div class="exsum">
      <h3>Executive Summary &mdash; ${y}</h3>
      <p>Of <b>${wd}</b> actively measured goals in ${y} across ${scope}, <b>${c.met} (${rate}%)</b> have been met and
      <b>${c.track}</b> are tracking to meet target. <b>${atRisk}</b> require leadership attention${c.off?`, including <b>${c.off}</b> currently off track`:''}.
      ${c.nodata} measure${c.nodata===1?' is':'s are'} planned for future years.${stf?` This report is filtered to show only <b>${Engine.STATUS[stf].label}</b> measures.`:''}</p>
      <ul class="quick">${hits}</ul>
    </div>`;
  }

  function executive(){
    const y=App.currentYear(), cmp=App.compareYear(), stf=stFilter();
    const rows=gather(y), c=counts(rows), wd=rows.length-c.nodata;
    const shown=applyStatus(rows);
    const secs=sections();
    const scope = secs.length===DB.sectionOrder.length ? 'all five pillars' : `${secs.length} selected pillar${secs.length===1?'':'s'}`;
    const groups=[['met','Goals Met','#008457'],['track','Tracking to Meet','#00A8CD'],['jeopardy','In Jeopardy','#F8991D'],['off','Missed / Off Track','#D73647'],['nodata','Planned / No Data','#808285']];
    let body=header({title:`Executive Performance Report &mdash; ${y}`,sub:`Strategic scorecard summary across ${scope} &middot; compared to ${cmp}`});
    body+=filterBanner(y);
    body+=execSummary(y,cmp);
    body+=`<div class="kpis">
      <div class="kpi" style="border-top-color:#008457"><div class="n" style="color:#008457">${c.met}</div><div class="l">Goals Met</div></div>
      <div class="kpi" style="border-top-color:#00A8CD"><div class="n" style="color:#00A8CD">${c.track}</div><div class="l">Tracking</div></div>
      <div class="kpi" style="border-top-color:#F8991D"><div class="n" style="color:#F8991D">${c.jeopardy}</div><div class="l">In Jeopardy</div></div>
      <div class="kpi" style="border-top-color:#D73647"><div class="n" style="color:#D73647">${c.off}</div><div class="l">Off Track</div></div></div>`;
    const list = stf ? groups.filter(g=>g[0]===stf) : groups;
    let any=false;
    list.forEach(([k,lbl,col])=>{const g=shown.filter(x=>x.ev.status.key===k);if(!g.length)return;any=true;body+=`<h2 class="sec" style="border-color:${col}">${lbl} (${g.length})</h2>${rowsTable(g,true,y,cmp)}`;});
    if(!any) body+=`<div class="none">No measures match the current selections.</div>`;
    open('Executive Report',body);
  }
  function onepage(){
    const y=App.currentYear(), cmp=App.compareYear(), stf=stFilter();
    const c=counts(gather(y));
    let body=header({title:`One-Page Scorecard &mdash; ${y}`,sub:`At-a-glance strategic performance &middot; compared to ${cmp}`});
    body+=filterBanner(y);
    body+=execSummary(y,cmp);
    body+=`<div class="kpis">
      <div class="kpi" style="border-top-color:#008457"><div class="n" style="color:#008457">${c.met}</div><div class="l">Met</div></div>
      <div class="kpi" style="border-top-color:#00A8CD"><div class="n" style="color:#00A8CD">${c.track}</div><div class="l">Tracking</div></div>
      <div class="kpi" style="border-top-color:#F8991D"><div class="n" style="color:#F8991D">${c.jeopardy}</div><div class="l">Jeopardy</div></div>
      <div class="kpi" style="border-top-color:#D73647"><div class="n" style="color:#D73647">${c.off}</div><div class="l">Off Track</div></div>
      <div class="kpi" style="border-top-color:#808285"><div class="n" style="color:#808285">${c.nodata}</div><div class="l">Planned</div></div></div>`;
    let any=false;
    sections().forEach(sec=>{
      let list=measuresIn(sec).map(m=>({sec,m,r:recFor(m,y)})).filter(x=>x.r).map(x=>({...x,ev:Engine.evaluate(x.r)}));
      list=applyStatus(list);
      if(!list.length) return;
      any=true;
      body+=`<h2 class="sec" style="border-color:${DB.pillarColors[sec]}">${sec}</h2>${rowsTable(list,false,y,cmp)}`;
    });
    if(!any) body+=`<div class="none">No measures match the current selections.</div>`;
    open('One-Page Report',body);
  }
  function concerns(){
    const y=App.currentYear(), cmp=App.compareYear();
    const rows=gather(y).filter(x=>x.ev.status.key==='jeopardy'||x.ev.status.key==='off');
    const secs=sections();
    const scope = secs.length===DB.sectionOrder.length ? 'all pillars' : secs.join(', ');
    let body=header({title:`Areas of Concern &mdash; ${y}`,sub:`Measures in jeopardy or off track requiring action &middot; ${scope}`});
    body+=filterBanner(y);
    body+=execSummary(y,cmp);
    if(!rows.length){body+=`<div class="narr">&#127881; No measures are in jeopardy or off track for ${y} within the current selection. All measured goals are met or tracking to meet.</div>`;}
    else{
      body+=`<div class="narr"><b>${rows.length}</b> measure(s) need attention. Prioritize the off-track items (red) for immediate corrective planning.</div>`;
      const off=rows.filter(x=>x.ev.status.key==='off'), jeo=rows.filter(x=>x.ev.status.key==='jeopardy');
      if(off.length){body+=`<h2 class="sec" style="border-color:#D73647">Off Track &mdash; Immediate Action (${off.length})</h2>${rowsTable(off,true,y,cmp)}`;}
      if(jeo.length){body+=`<h2 class="sec" style="border-color:#F8991D">In Jeopardy &mdash; Monitor Closely (${jeo.length})</h2>${rowsTable(jeo,true,y,cmp)}`;}
    }
    open('Concerns Report',body);
  }
  function pillar(){
    const y=App.currentYear(), cmp=App.compareYear(), stf=stFilter();
    let body=header({title:`Pillar Scorecard &mdash; ${y}`,sub:`Detailed performance by strategic pillar &middot; compared to ${cmp}`});
    body+=filterBanner(y);
    body+=execSummary(y,cmp);
    let any=false;
    sections().forEach(sec=>{
      const full=measuresIn(sec).map(m=>({sec,m,r:recFor(m,y)})).filter(x=>x.r).map(x=>({...x,ev:Engine.evaluate(x.r)}));
      const list=applyStatus(full);
      if(!list.length) return;
      any=true;
      const c=counts(full);
      body+=`<h2 class="sec" style="border-color:${DB.pillarColors[sec]}">${sec}</h2>
        <p style="font-size:11px;color:#808285;margin-bottom:8px">${c.met} met &middot; ${c.track} tracking &middot; ${c.jeopardy} in jeopardy &middot; ${c.off} off track</p>
        ${rowsTable(list,false,y,cmp)}`;
    });
    if(!any) body+=`<div class="none">No measures match the current selections.</div>`;
    open('Pillar Scorecard',body);
  }
  function trend(){
    const y=App.currentYear(), cmp=App.compareYear(), stf=stFilter();
    const yrs=DB.years;
    let body=header({title:'Year-over-Year Trend Report',sub:`Actual performance across all tracked years (${yrs[0]}&ndash;${yrs[yrs.length-1]}) &middot; ${y} &amp; ${cmp} highlighted`});
    body+=filterBanner(y);
    body+=execSummary(y,cmp);
    let any=false;
    sections().forEach(sec=>{
      const ms=measuresIn(sec).filter(m=>{
        if(!stf) return true;
        const r=recFor(m,y); if(!r) return false;
        return Engine.evaluate(r).status.key===stf;
      });
      if(!ms.length) return;
      any=true;
      body+=`<h2 class="sec" style="border-color:${DB.pillarColors[sec]}">${sec}</h2>`;
      let h=`<table><tr><th>Measure</th>${yrs.map(yy=>`<th class="${yy===y?'hl':yy===cmp?'hlc':''}">${yy}${yy===y?' &#9733;':yy===cmp?' &#9671;':''}</th>`).join('')}</tr>`;
      ms.forEach(m=>{
        h+=`<tr><td>${m}</td>`+yrs.map(yy=>{const cls=yy===y?'hl':yy===cmp?'hlc':'';const r=recFor(m,yy);if(!r||r.actual==null)return `<td class="${cls}" style="color:#c3c5c8">&mdash;</td>`;const ev=Engine.evaluate(r);return `<td class="${cls}"><span class="pill-strip" style="background:${ev.status.hex}"></span>${r.actual}</td>`;}).join('')+'</tr>';
      });
      body+=h+'</table>';
    });
    if(!any) body+=`<div class="none">No measures match the current selections.</div>`;
    body+=`<p style="font-size:10px;color:#9a9da1;margin-top:6px">&#9733; Selected year (${y}) &middot; &#9671; Comparison year (${cmp})</p>`;
    open('Year-over-Year Report',body);
  }
  return {executive,onepage,concerns,pillar,trend};
})();

/* ============ CHATBOT — "Flash the Fact Finder" ============
   Offline, rule-based NLU over dbo.GlobalMeasures.
   ~50 dynamic intents + fuzzy (typo-tolerant) keyword matching.
   ============================================================ */
const Chat=(function(){

  /* ---------- selectable starter questions (10) ---------- */
  const suggestions=[
    "How are we doing overall?",
    "What's in jeopardy this year?",
    "Which goals did we meet?",
    "What's off track?",
    "Show me safety measures",
    "Summarize Affordable Service",
    "How is SAIDI trending?",
    "Best and worst pillar?",
    "What changed vs last year?",
    "What can you do?"
  ];

  /* ---------- panel plumbing ---------- */
  function toggle(){document.getElementById('chatPanel').classList.toggle('hidden');}
  function add(html,who){const b=document.getElementById('chatBody');const d=document.createElement('div');d.className='msg '+who;d.innerHTML=html;b.appendChild(d);b.scrollTop=b.scrollHeight;}

  /* ---------- generic data helpers ---------- */
  function allRows(year){const rows=[];DB.sectionOrder.forEach(sec=>measuresIn(sec).forEach(m=>{const r=recFor(m,year);if(r)rows.push({sec,m,r,ev:Engine.evaluate(r)});}));return rows;}
  function tally(rows){const c={met:0,track:0,jeopardy:0,off:0,nodata:0};rows.forEach(x=>c[x.ev.status.key]++);return c;}
  function measured(rows){return rows.length-tally(rows).nodata;}
  function pct(n,d){return d?Math.round(n/d*100):0;}
  function yearFromText(t){const m=t.match(/20(2[4-9]|30)/);return m?parseInt(m[0]):App.currentYear();}
  function yearsInText(t){const m=t.match(/20(2[4-9]|30)/g)||[];return [...new Set(m.map(Number))];}
  function latestDataYear(){let best=null;DB.records.forEach(r=>{if(r.actual!=null&&(best==null||r.year>best))best=r.year;});return best||App.currentYear();}
  function tbl(list,year,cap){
    cap=cap||12;
    if(!list.length) return '<i>No measures matched that request.</i>';
    let h=`<table><tr><th>Measure</th><th>${year}</th><th>Goal</th><th>Status</th></tr>`;
    list.slice(0,cap).forEach(x=>{h+=`<tr><td>${x.m}</td><td>${x.r.actual??'—'}</td><td>${x.r.goal??'—'}</td><td style="color:${x.ev.status.hex};font-weight:700">${x.ev.status.label}</td></tr>`;});
    h+='</table>';
    if(list.length>cap) h+=`<div style="font-size:11px;margin-top:4px">…and ${list.length-cap} more.</div>`;
    return h;
  }
  function pillarMatch(t){
    const map={'safety':'Top Safety Performance','safe':'Top Safety Performance','injury':'Top Safety Performance',
      'member':'Exceptional Member Experience','experience':'Exceptional Member Experience','customer':'Exceptional Member Experience','satisfaction':'Exceptional Member Experience',
      'afford':'Affordable Service','cost':'Affordable Service','rate':'Affordable Service','expense':'Affordable Service','price':'Affordable Service',
      'utility':'Utility of the Future','future':'Utility of the Future','reliab':'Utility of the Future','grid':'Utility of the Future','outage':'Utility of the Future',
      'culture':'High Performance Culture','workforce':'High Performance Culture','wellness':'High Performance Culture','employee':'High Performance Culture','people':'High Performance Culture','hr':'High Performance Culture'};
    for(const k in map){if(t.includes(k))return map[k];}
    return null;
  }
  /* measure alias table — powers ~20 measure-specific answers + the glossary */
  const ALIAS={
    'saidi':['System Average Interruption Duration Index'],
    'outage duration':['System Average Interruption Duration Index'],
    'cemi':['Consumers Experiencing Multiple Interruptions'],
    'multiple interruptions':['Consumers Experiencing Multiple Interruptions'],
    'dart':['Days Away Restricted Transferred'],
    'injury':['Days Away Restricted Transferred'],
    'resap':['Rural Electric Safety Achievement Program'],
    'qfo':['Qualified Field Observer'],
    'observer':['Qualified Field Observer'],
    'inspection':['Qualified Field Observer'],
    'presentation':['Community Safety Presentations'],
    'acsi':['American Customer Satisfaction Index'],
    'satisfaction':['American Customer Satisfaction Index'],
    'loyalty':['Membership Loyalty Index'],
    'advocate':['Co-op Voices Advocates'],
    'co-op voices':['Co-op Voices Advocates'],
    'survey':['Follow Up Survey Index'],
    'controllable expense':['Controllable Expense Per Consumer'],
    'power cost':['Power Cost as a % of Revenue'],
    'consumer per employee':['Average Consumer per Employee'],
    'quartile':['Rates - Measured by Quartile'],
    'rates':['Rates - Measured by Quartile'],
    'carbon':['Carbon Free Generation'],
    'renewable':['Carbon Free Generation'],
    'vpp':["Virtual Power Plant"],
    'virtual power':["Virtual Power Plant"],
    'career':['Active Career Development Plans'],
    'development plan':['Active Career Development Plans'],
    'workforce':['Workforce Development'],
    'wellness':['Total Wellness Engagement'],
    'security':['Security Awareness Proficiency'],
    'phishing':['Security Awareness Proficiency']
  };
  const GLOSSARY={
    'saidi':'<b>SAIDI</b> — System Average Interruption Duration Index: the average total minutes of outage an average member experiences in a year. Lower is better; the PVREA goal is ≤ 50.',
    'cemi':'<b>CEMI-3</b> — Consumers Experiencing Multiple Interruptions: we track the % of members who had <i>fewer than</i> three sustained interruptions. Higher is better.',
    'dart':'<b>DART</b> — Days Away, Restricted or Transferred: an OSHA safety rate covering injuries that cost work days or require restricted duty. The goal is 0.',
    'resap':'<b>RESAP</b> — Rural Electric Safety Achievement Program: NRECA\'s safety accreditation review. We target a score greater than 3.0.',
    'acsi':'<b>ACSI</b> — American Customer Satisfaction Index: a nationally benchmarked member-satisfaction score out of 100.',
    'vpp':"<b>VPP</b> — Virtual Power Plant: the total MW of dispatchable member-side resources (thermostats, batteries, water heaters) PVREA can call on.",
    'qfo':'<b>QFO</b> — Qualified Field Observer inspections: documented field safety observations, tracked separately for business hours and after hours.'
  };
  function measureByAlias(t){
    let best=null,bestLen=0;
    for(const k in ALIAS){
      if(t.includes(k)&&k.length>bestLen){best=ALIAS[k][0];bestLen=k.length;}
    }
    if(best){
      const rec=DB.records.find(r=>r.measure.toLowerCase().includes(best.toLowerCase()));
      if(rec) return rec.measure;
    }
    /* fall back to loose name matching against the measure list */
    const words=t.split(/\s+/).filter(w=>w.length>3);
    let hit=null,score=0;
    DB.records.forEach(r=>{
      const nm=r.measure.toLowerCase();
      let s=0; words.forEach(w=>{if(nm.includes(w))s++;});
      if(s>score){score=s;hit=r.measure;}
    });
    return score>=1?hit:null;
  }
  function measureCard(m,year){
    const r=recFor(m,year);
    if(!r) return `I don't have a <b>${m}</b> record for ${year}. Tracked years run ${DB.years[0]}–${DB.years[DB.years.length-1]}.`;
    const ev=Engine.evaluate(r);
    const paceNote=(ev.paceKind==='pace')?` Expected pace by today is about ${Math.round(ev.pace*100)}% of the annual target.`:'';
    return `<b>${m}</b> (${year})<br>Actual <b>${r.actual??'—'}</b> vs goal <b>${r.goal??'—'}</b> — <span style="color:${ev.status.hex};font-weight:700">${ev.status.label}</span>.${paceNote}`;
  }
  function trendTable(m){
    let h=`<b>${m}</b> across all tracked years:<table><tr><th>Year</th><th>Actual</th><th>Goal</th></tr>`;
    DB.years.forEach(y=>{const r=recFor(m,y);h+=`<tr><td>${y}</td><td>${r&&r.actual!=null?r.actual:'—'}</td><td>${r?(r.goal??'—'):'—'}</td></tr>`;});
    return h+'</table>';
  }
  function pillarStats(year){
    return DB.sectionOrder.map(sec=>{
      const list=measuresIn(sec).map(m=>recFor(m,year)).filter(Boolean).map(r=>({ev:Engine.evaluate(r)}));
      const c=tally(list),w=list.length-c.nodata;
      return {sec,w,met:c.met,risk:c.jeopardy+c.off,rate:pct(c.met,w)};
    }).filter(p=>p.w>0);
  }
  function movers(year,cmp){
    const out=[];
    DB.sectionOrder.forEach(sec=>measuresIn(sec).forEach(m=>{
      const a=recFor(m,year),b=recFor(m,cmp);
      if(!a||!b||a.actual==null||b.actual==null) return;
      const ea=Engine.evaluate(a),eb=Engine.evaluate(b);
      if(ea.pct==null||eb.pct==null) return;
      out.push({sec,m,delta:ea.pct-eb.pct,now:a.actual,then:b.actual});
    }));
    return out.sort((a,b)=>b.delta-a.delta);
  }

  /* =========================================================
     INTENT LIBRARY — 50 dynamic responses
     Each intent: {id, keys:[trigger words/phrases], run(ctx)}
     ctx = {t, year, cmp, rows, pil, measure}
     ========================================================= */
  const INTENTS=[
  /* --- 1-8 : status & scorecard roll-ups --- */
  {id:'overall',keys:['overall','summary','summarize','overview','how are we doing','status','scorecard','snapshot','recap','state of'],run:c=>{
    const t2=tally(c.rows),wd=measured(c.rows);
    return `<b>${c.year} ${c.pil?c.pil:'overall'}:</b> ${t2.met} of ${wd} measured goals met (<b>${pct(t2.met,wd)}%</b>), ${t2.track} tracking to meet, ${t2.jeopardy} in jeopardy, ${t2.off} off track, ${t2.nodata} planned/not yet reporting.${tbl(c.rows,c.year,8)}`;}},
  {id:'met',keys:['met','achieved','accomplished','hit the goal','made goal','success','wins','goals we met','did we meet','which goals did we meet','green'],run:c=>{
    const l=c.rows.filter(x=>x.ev.status.key==='met');
    return `<b>${l.length}</b> goal${l.length===1?'':'s'} met in ${c.year}${c.pil?` for <b>${c.pil}</b>`:''}:${tbl(l,c.year)}`;}},
  {id:'jeopardy',keys:['jeopardy','jepordy','at risk','risky','concern','worry','warning','amber','orange','watch list','watchlist'],run:c=>{
    const l=c.rows.filter(x=>x.ev.status.key==='jeopardy');
    return `<b>${l.length}</b> measure${l.length===1?' is':'s are'} <b>in jeopardy</b> in ${c.year}${c.pil?` for <b>${c.pil}</b>`:''}:${tbl(l,c.year)}`;}},
  {id:'off',keys:['off track','offtrack','missed','miss','failing','failed','behind','red','not meeting','under target','below target'],run:c=>{
    const l=c.rows.filter(x=>x.ev.status.key==='off');
    return `<b>${l.length}</b> measure${l.length===1?' is':'s are'} <b>missed / off track</b> in ${c.year}${c.pil?` for <b>${c.pil}</b>`:''}:${tbl(l,c.year)}`;}},
  {id:'track',keys:['tracking','on track','ontrack','close to goal','almost there','nearly','in progress'],run:c=>{
    const l=c.rows.filter(x=>x.ev.status.key==='track');
    return `<b>${l.length}</b> measure${l.length===1?' is':'s are'} <b>tracking to meet</b> target in ${c.year}:${tbl(l,c.year)}`;}},
  {id:'nodata',keys:['no data','nodata','planned','not started','future goals','upcoming goals','blank','missing data','gaps'],run:c=>{
    const l=c.rows.filter(x=>x.ev.status.key==='nodata');
    return `<b>${l.length}</b> measure${l.length===1?'':'s'} in ${c.year} have no actuals yet — these are planned or still being collected:${tbl(l,c.year)}`;}},
  {id:'attention',keys:['needs attention','action','action items','priorit','what should i focus','focus on','fix','problem','trouble','issues'],run:c=>{
    const l=c.rows.filter(x=>x.ev.status.key==='off').concat(c.rows.filter(x=>x.ev.status.key==='jeopardy'));
    if(!l.length) return `Nothing needs escalation in ${c.year} — every measured goal is met or tracking to meet. 🎉`;
    return `Prioritize these <b>${l.length}</b> measure${l.length===1?'':'s'} in ${c.year} (off track first, then in jeopardy):${tbl(l,c.year)}`;}},
  {id:'rate',keys:['attainment','percent met','percentage','success rate','hit rate','how many met','score'],run:c=>{
    const t2=tally(c.rows),wd=measured(c.rows);
    return `${c.year} attainment is <b>${pct(t2.met,wd)}%</b> — ${t2.met} met out of ${wd} actively measured goals. Including the ${t2.nodata} planned measure${t2.nodata===1?'':'s'}, the scorecard carries ${c.rows.length} rows this year.`;}},

  /* --- 9-14 : pillar analysis --- */
  {id:'pillarSummary',keys:['pillar','category','categories','section','strategic areas','breakdown by pillar'],run:c=>{
    const ps=pillarStats(c.year);
    let h=`<b>${c.year} by pillar:</b><table><tr><th>Pillar</th><th>Met</th><th>Measured</th><th>Rate</th><th>At risk</th></tr>`;
    ps.forEach(p=>{h+=`<tr><td>${p.sec}</td><td>${p.met}</td><td>${p.w}</td><td>${p.rate}%</td><td>${p.risk}</td></tr>`;});
    return h+'</table>';}},
  {id:'bestPillar',keys:['best pillar','strongest','doing well','top performing','leading pillar','winner'],run:c=>{
    const b=pillarStats(c.year).sort((x,y)=>y.rate-x.rate||y.w-x.w)[0];
    return b?`The strongest pillar in ${c.year} is <b>${b.sec}</b> — ${b.met} of ${b.w} measured goals met (${b.rate}%).`:`No measured pillars in ${c.year} yet.`;}},
  {id:'worstPillar',keys:['worst pillar','weakest','most exposure','struggling','lagging','biggest problem area'],run:c=>{
    const w=pillarStats(c.year).sort((x,y)=>y.risk-x.risk||x.rate-y.rate)[0];
    return w?`<b>${w.sec}</b> carries the most exposure in ${c.year} — ${w.risk} measure${w.risk===1?'':'s'} in jeopardy or off track, ${w.rate}% attainment.`:`No measured pillars in ${c.year} yet.`;}},
  {id:'listPillars',keys:['list pillars','what pillars','which pillars','name the pillars','five pillars','strategic plan','how is this organized','structure'],run:c=>
    `PVREA's scorecard is organized into ${DB.sectionOrder.length} strategic pillars:<br>• ${DB.sectionOrder.join('<br>• ')}<br>Ask me to summarize any one of them.`},
  {id:'pillarDetail',keys:['show me','tell me about','detail','deep dive','drill'],run:c=>{
    if(!c.pil) return null;
    const t2=tally(c.rows);
    return `<b>${c.pil}</b> in ${c.year}: ${t2.met} met, ${t2.track} tracking, ${t2.jeopardy} in jeopardy, ${t2.off} off track.${tbl(c.rows,c.year)}`;}},
  {id:'compareP',keys:['compare pillars','rank pillars','rank the pillars','which pillar is better','pillar ranking','order the pillars'],run:c=>{
    const ps=pillarStats(c.year).sort((a,b)=>b.rate-a.rate);
    return `Pillar ranking for ${c.year} by attainment:<br>`+ps.map((p,i)=>`${i+1}. <b>${p.sec}</b> — ${p.rate}% (${p.met}/${p.w})`).join('<br>');}},

  /* --- 15-22 : measures, trends, comparisons --- */
  {id:'measureLookup',keys:['what is the value','current value','how did we do on','number for','result for','actual'],run:c=>c.measure?measureCard(c.measure,c.year):null},
  {id:'trend',keys:['trend','trending','over time','history','historical','year over year','yoy','trajectory','progression'],run:c=>{
    if(c.measure) return trendTable(c.measure);
    const yrs=DB.years.filter(y=>allRows(y).some(x=>x.r.actual!=null));
    let h=`<b>Attainment by year:</b><table><tr><th>Year</th><th>Met</th><th>Measured</th><th>Rate</th></tr>`;
    yrs.forEach(y=>{const r=allRows(y),t2=tally(r),wd=measured(r);h+=`<tr><td>${y}</td><td>${t2.met}</td><td>${wd}</td><td>${pct(t2.met,wd)}%</td></tr>`;});
    return h+'</table>';}},
  {id:'goalFor',keys:['goal for','target for','targets','what are we aiming','threshold','benchmark','objective','what is the goal'],run:c=>{
    if(c.measure){
      let h=`Targets for <b>${c.measure}</b>:<table><tr><th>Year</th><th>Goal</th><th>Actual</th></tr>`;
      DB.years.forEach(y=>{const r=recFor(c.measure,y);if(r)h+=`<tr><td>${y}</td><td>${r.goal??'—'}</td><td>${r.actual??'—'}</td></tr>`;});
      return h+'</table>';
    }
    return `Goals in ${c.year}${c.pil?` for <b>${c.pil}</b>`:''}:${tbl(c.rows,c.year,10)}`;}},
  {id:'compareYears',keys:['vs','versus','compared to','difference between','change from','better than last year','worse than'],run:c=>{
    const ys=yearsInText(c.t);
    const a=ys[0]??c.year, b=ys[1]??c.cmp;
    const ra=allRows(a),rb=allRows(b),ta=tally(ra),tb=tally(rb);
    const pa=pct(ta.met,measured(ra)),pb=pct(tb.met,measured(rb));
    const d=pa-pb;
    return `<b>${a} vs ${b}:</b> attainment ${d>0?`improved <b>${d} pts</b>`:d<0?`declined <b>${Math.abs(d)} pts</b>`:'was flat'} (${pa}% vs ${pb}%). ${a}: ${ta.met} met / ${ta.jeopardy+ta.off} at risk. ${b}: ${tb.met} met / ${tb.jeopardy+tb.off} at risk.`;}},
  {id:'gain',keys:['biggest gain','most improved','improvement','improved the most','best mover','biggest jump'],run:c=>{
    const m=movers(c.year,c.cmp)[0];
    return m?`Biggest gain vs ${c.cmp}: <b>${m.m}</b> (${c.pil||m.sec}) moved from <b>${m.then}</b> to <b>${m.now}</b>.`:`I don't have enough paired actuals between ${c.cmp} and ${c.year} to rank movers.`;}},
  {id:'slide',keys:['biggest drop','declined','worsened','largest slide','regression','went down','slipped'],run:c=>{
    const list=movers(c.year,c.cmp);const m=list[list.length-1];
    return m&&m.delta<0?`Largest slide vs ${c.cmp}: <b>${m.m}</b> (${m.sec}) fell from <b>${m.then}</b> to <b>${m.now}</b>.`:`Nothing declined materially versus ${c.cmp}.`;}},
  {id:'forecast',keys:['forecast','future','projection','next year','2027 goals','out years','long term','roadmap'],run:c=>{
    const explicit=yearsInText(c.t)[0];
    const fy=explicit??Math.max(c.year+1,new Date().getFullYear()+1);
    const rows=allRows(fy);
    if(!rows.length) return `I don't have ${fy} targets loaded. Tracked years run ${DB.years[0]}–${DB.years[DB.years.length-1]}.`;
    return `Targets already set for <b>${fy}</b> (${rows.length} measures). Note these are plan values — actuals are not reported yet:${tbl(rows,fy,10)}`;}},
  {id:'listMeasures',keys:['list measures','all measures','what do you track','which measures','every measure','measure list'],run:c=>{
    const names=[...new Set(DB.records.map(r=>r.measure))];
    return `I track <b>${names.length}</b> distinct measures across ${DB.sectionOrder.length} pillars and ${DB.years.length} years (${DB.records.length} rows total):<br>• ${names.slice(0,20).join('<br>• ')}${names.length>20?`<br>…and ${names.length-20} more.`:''}`;}},

  /* --- 23-30 : safety / member / affordability / reliability shortcuts --- */
  {id:'safetyQ',keys:['injuries','safety record','dart rate','accidents','osha','near miss'],run:c=>{
    const rows=allRows(c.year).filter(x=>x.sec==='Top Safety Performance');
    return `<b>Top Safety Performance — ${c.year}</b>${tbl(rows,c.year)}`;}},
  {id:'reliability',keys:['reliability','outages','interruptions','minutes out','power quality','lights'],run:c=>{
    const l=allRows(c.year).filter(x=>/SAIDI|CEMI|Interruption/i.test(x.m));
    return `Reliability measures in ${c.year}:${tbl(l,c.year)}`;}},
  {id:'carbonQ',keys:['carbon','clean energy','renewable','emissions','green energy','decarbon'],run:c=>measureCard('Carbon Free Generation',c.year)},
  {id:'vppQ',keys:['virtual power plant','vpp','demand response','thermostat','battery','dispatchable'],run:c=>{
    const rec=DB.records.find(r=>/Virtual Power Plant/i.test(r.measure));
    return rec?measureCard(rec.measure,c.year):null;}},
  {id:'memberQ',keys:['member satisfaction','satisfaction score','how happy','loyalty','advocates','survey score'],run:c=>{
    const rows=allRows(c.year).filter(x=>x.sec==='Exceptional Member Experience');
    return `<b>Exceptional Member Experience — ${c.year}</b>${tbl(rows,c.year)}`;}},
  {id:'affordQ',keys:['rates','bills','power cost','expenses','affordability','cheap','competitive'],run:c=>{
    const rows=allRows(c.year).filter(x=>x.sec==='Affordable Service');
    return `<b>Affordable Service — ${c.year}</b>${tbl(rows,c.year)}`;}},
  {id:'cultureQ',keys:['employees','staff','training','wellness','career development','retention','engagement'],run:c=>{
    const rows=allRows(c.year).filter(x=>x.sec==='High Performance Culture');
    return `<b>High Performance Culture — ${c.year}</b>${tbl(rows,c.year)}`;}},
  {id:'securityQ',keys:['cyber','security awareness','phishing','it security','proficiency'],run:c=>{
    const rec=DB.records.find(r=>/Security Awareness/i.test(r.measure));
    return rec?measureCard(rec.measure,c.year):null;}},

  /* --- 31-38 : how the dashboard works --- */
  {id:'howStatus',keys:['how is status','how do you calculate','methodology','logic','rules','how is it scored','color coding','why is this red'],run:c=>
    `Status is calculated live from actual vs goal:<br>• <b style="color:#008457">Goal Met</b> — target achieved.<br>• <b style="color:#00A8CD">Tracking to Meet</b> — within ~10% of target (or ≥95% of expected pace).<br>• <b style="color:#F8991D">In Jeopardy</b> — 75–90% of target.<br>• <b style="color:#D73647">Missed / Off Track</b> — below 75%.<br>• <b style="color:#808285">No Data / Planned</b> — no actual reported yet.<br>Direction is inferred from the goal operator (≥, ≤, &lt;, &gt;), so lower-is-better measures like SAIDI and DART are scored in reverse.`},
  {id:'pace',keys:['tick','pace','expected pace','vertical line','marker','prorated','pro rata','mid-year'],run:c=>
    `The ┃ tick on each progress bar is the reference line. For cumulative counts still in progress this year (inspections, presentations, advocates) it shows the share of the annual target you'd expect by today's date; for every other measure it marks the 100% goal line.`},
  {id:'dataSource',keys:['where does the data','data source','database','sql','table','refresh','how current','last updated','stale'],run:c=>
    `Everything here comes from <b>Azure SQL · dbo.GlobalMeasures</b>, injected by the Flask app at page load (currently ${DB.records.length} rows, ${DB.years[0]}–${DB.years[DB.years.length-1]}). Use <b>↻ Refresh live data</b> in the header to re-query <code>/api/measures</code> without reloading the page.`},
  {id:'reports',keys:['report','pdf','print','export','download','one page','executive report','share with the board'],run:c=>
    `Five printable reports are available in the header, and each one respects your current year, comparison, status and pillar selections:<br>• <b>Executive Report</b> — full narrative + status groupings<br>• <b>One-Page</b> — at-a-glance scorecard<br>• <b>Concerns</b> — jeopardy and off-track only<br>• <b>Pillar Scorecard</b> — pillar-by-pillar detail<br>• <b>Year-over-Year</b> — every measure across all years`},
  {id:'filters',keys:['filter','chip','dropdown','slicer','how do i change the year','controls','narrow down'],run:c=>
    `Use the control bar: <b>Year</b> sets the reporting year, <b>Compare</b> picks the benchmark year (defaults to prior year), <b>Status</b> narrows to a single status, and the colored <b>pillar chips</b> toggle pillars on and off. Reports and the dashboard both follow those selections.`},
  {id:'legend',keys:['legend','what do the colors mean','key','symbols'],run:c=>
    `Legend: <b style="color:#008457">green</b> = goal met, <b style="color:#00A8CD">light blue</b> = tracking to meet, <b style="color:#F8991D">gold</b> = in jeopardy, <b style="color:#D73647">red</b> = missed/off track, <b style="color:#808285">gray</b> = planned or no data. Pillar header colors follow the PVREA Brand Standards Guide.`},
  {id:'years',keys:['what years','date range','how far back','coverage','time period','tracked years'],run:c=>
    `The scorecard covers <b>${DB.years[0]}–${DB.years[DB.years.length-1]}</b>. The most recent year with reported actuals is <b>${latestDataYear()}</b>; later years hold approved targets only.`},
  {id:'counts',keys:['how many records','row count','how much data','size','total measures'],run:c=>{
    const names=[...new Set(DB.records.map(r=>r.measure))];
    return `Currently loaded: <b>${DB.records.length}</b> records, <b>${names.length}</b> distinct measures, <b>${DB.sectionOrder.length}</b> pillars, <b>${DB.years.length}</b> years.`;}},

  /* --- 39-44 : glossary & definitions --- */
  {id:'define',keys:['what does','stand for','definition','define','meaning','acronym','abbreviation','what is a'],run:c=>{
    for(const k in GLOSSARY){if(c.t.includes(k))return GLOSSARY[k];}
    if(c.measure) return `<b>${c.measure}</b> is tracked under ${DB.records.find(r=>r.measure===c.measure).section}. ${measureCard(c.measure,c.year)}`;
    return `I can define SAIDI, CEMI-3, DART, RESAP, ACSI, VPP and QFO — just name the acronym.`;}},
  {id:'saidiDef',keys:['saidi mean','what is saidi'],run:c=>GLOSSARY.saidi},
  {id:'cemiDef',keys:['cemi mean','what is cemi','cemi-3'],run:c=>GLOSSARY.cemi},
  {id:'dartDef',keys:['dart mean','what is dart'],run:c=>GLOSSARY.dart},
  {id:'resapDef',keys:['resap mean','what is resap'],run:c=>GLOSSARY.resap},
  {id:'acsiDef',keys:['acsi mean','what is acsi'],run:c=>GLOSSARY.acsi},

  /* --- 45-50 : conversational & service --- */
  {id:'help',keys:['help','what can you do','capabilities','options','commands','how do i use you','examples'],run:c=>
    `I read the live Global Measures data and answer in plain language. Try:<br>• "How are we doing overall?"<br>• "What's in jeopardy in ${c.year}?"<br>• "How is SAIDI trending?"<br>• "Summarize Affordable Service"<br>• "Compare 2026 vs 2025"<br>• "What does CEMI-3 mean?"<br>• "Which pillar is strongest?"<br>• "How is status calculated?"`},
  {id:'who',keys:['who are you','your name','flash','what are you','are you ai','bot','chatgpt','copilot'],run:c=>
    `I'm <b>Flash the Fact Finder</b> ⚡ — PVREA's scorecard guide. I don't call an external AI service; I reason directly over the ${DB.records.length} rows of Global Measures data loaded in this page, so my answers always match what you see on screen.`},
  {id:'greeting',keys:['hi','hello','hey','good morning','good afternoon','howdy','yo','greetings'],run:c=>
    `Hey there! ⚡ Ask me about any pillar, measure, status or year — or tap one of the suggestions below to get rolling.`},
  {id:'thanks',keys:['thanks','thank you','appreciate','awesome','great job','nice','perfect','helpful'],run:c=>
    `Happy to help! ⚡ Ask me anything else about the ${c.year} scorecard.`},
  {id:'bye',keys:['bye','goodbye','see ya','later','done','that\'s all','close'],run:c=>
    `Catch you later! Click the ⚡ button any time to reopen me.`},
  {id:'contact',keys:['who do i contact','support','question about the data','wrong','incorrect','error','bug','update the data','change a value'],run:c=>
    `For data corrections or dashboard changes, contact the <b>AI &amp; BI Team</b> — measure owners submit updates through the AI &amp; BI Help Desk and they flow into dbo.GlobalMeasures on the next refresh. If a number looks wrong here, it almost always means the source row needs updating.`}
  ];

  /* =========================================================
     FUZZY MATCHER
     Scores every intent on: exact phrase hit, token overlap,
     and Levenshtein-tolerant near-miss (handles typos).
     ========================================================= */
  function lev(a,b){
    if(a===b) return 0;
    const m=a.length,n=b.length;
    if(!m||!n) return Math.max(m,n);
    let prev=Array.from({length:n+1},(_,i)=>i),cur=new Array(n+1);
    for(let i=1;i<=m;i++){
      cur[0]=i;
      for(let j=1;j<=n;j++){
        cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      }
      prev=cur.slice();
    }
    return prev[n];
  }
  function fuzzyHit(token,key){
    if(token===key) return 1;
    if(key.length>3&&token.length>3&&(token.startsWith(key)||key.startsWith(token))) return .85;
    const tol=key.length>7?2:key.length>4?1:0;
    if(tol&&Math.abs(token.length-key.length)<=tol&&lev(token,key)<=tol) return .7;
    return 0;
  }
  const STOP=new Set(['the','a','an','of','in','on','for','to','is','are','we','our','what','how','me','my','and','do','does','did','was','were','it','this','that','you','can','please','show','tell','give','about','with','any','all','be','been','i']);
  function score(t,tokens,intent){
    let s=0;
    intent.keys.forEach(k=>{
      const key=k.toLowerCase();
      if(key.includes(' ')){                       // multi-word phrase
        if(t.includes(key)) s+=key.split(' ').length*2.2;
        return;
      }
      if(t.includes(key)) s+=1.2;                  // substring hit
      tokens.forEach(tok=>{ s+=fuzzyHit(tok,key)*1.1; });
    });
    return s;
  }

  /* ---------- graceful, data-driven fallback (never "unavailable") ---------- */
  function fallback(c){
    const t2=tally(c.rows),wd=measured(c.rows);
    const risk=c.rows.filter(x=>x.ev.status.key==='off'||x.ev.status.key==='jeopardy').slice(0,3).map(x=>x.m);
    return `I'm not certain what you're after, so here's the quick picture for <b>${c.year}</b>: ${t2.met} of ${wd} measured goals met (${pct(t2.met,wd)}%), ${t2.track} tracking, ${t2.jeopardy+t2.off} needing attention${risk.length?` — notably ${risk.join(', ')}`:''}.<br><br>Try rephrasing with a pillar ("safety", "affordable service"), a measure ("SAIDI", "DART", "ACSI"), a status ("in jeopardy", "met"), or a year ("2025 vs 2026"). Type <b>help</b> for the full list of things I can do.`;
  }

  /* ---------- main answer router ---------- */
  function answer(q){
    const t=' '+q.toLowerCase().replace(/[^\w\s%-]/g,' ').replace(/\s+/g,' ').trim()+' ';
    const tokens=t.split(' ').filter(w=>w&&!STOP.has(w));
    const year=yearFromText(t), cmp=(yearsInText(t)[1]??App.compareYear());
    const pil=pillarMatch(t);
    let rows=allRows(year);
    if(pil) rows=rows.filter(x=>x.sec===pil);
    const ctx={t,q,year,cmp,rows,pil,measure:measureByAlias(t)};

    /* rank every intent, then run the best one that returns content */
    const ranked=INTENTS.map(i=>({i,s:score(t,tokens,i)})).sort((a,b)=>b.s-a.s);
    for(const r of ranked){
      if(r.s<1.0) break;
      try{ const out=r.i.run(ctx); if(out) return out; }catch(e){ /* try the next intent */ }
    }
    /* second chance: a recognized measure or pillar alone is enough to answer */
    if(ctx.measure) return measureCard(ctx.measure,year);
    if(pil){
      const t2=tally(rows);
      return `<b>${pil}</b> in ${year}: ${t2.met} met, ${t2.track} tracking, ${t2.jeopardy} in jeopardy, ${t2.off} off track.${tbl(rows,year)}`;
    }
    return fallback(ctx);
  }

  function send(){const i=document.getElementById('chatInput');const q=i.value.trim();if(!q)return;add(q,'user');i.value='';setTimeout(()=>add(answer(q),'bot'),200);}
  function init(){
    add(`Hi there! ⚡ I'm <b>Flash the Fact Finder</b>. I'm here to help you quickly find information, explore data, answer questions, and connect you with the insights you need. What would you like to know today?`,'bot');
    const s=document.getElementById('chatSuggest');
    suggestions.forEach(q=>{const b=document.createElement('button');b.textContent=q;b.onclick=()=>{document.getElementById('chatInput').value=q;send();};s.appendChild(b);});
  }
  return {toggle,send,init,answer};
})();

/* ============ AZURE SQL DATA SOURCE (via Flask) ============ */
const Data=(function(){

  const CONFIG={
    // Endpoint used by the "Refresh live data" button. Return the same
    // row shape as the injected payload:  @app.route('/api/measures')
    apiUrl:'/api/measures',
    autoRefreshMinutes:0     // e.g. 10 to re-poll while the page is open
  };

  const SECTION_ORDER=[
    "Top Safety Performance",
    "Exceptional Member Experience",
    "Affordable Service",
    "Utility of the Future",
    "High Performance Culture"
  ];

  const SECTION_COLORS={
    "Top Safety Performance":"#00A8CD",
    "Exceptional Member Experience":"#005A9C",
    "Affordable Service":"#7DB045",
    "Utility of the Future":"#008457",
    "High Performance Culture":"#808285"
  };

  let timer=null;

  function setStatus(state,msg){
    const el=document.getElementById('dsStatus'); if(!el)return;
    const c={live:'#2ecc71',cached:'#F8991D',loading:'#00A8CD',error:'#D73647'}[state]||'#808285';
    el.querySelector('.ds-dot').style.background=c;
    el.querySelector('.ds-text').innerHTML=msg;
  }

  /* --- value cleaning: SQL NULLs, empty strings, "-" placeholders --- */
  function clean(v){
    if(v===undefined||v===null) return null;
    const s=String(v).trim();
    if(!s||s.toUpperCase()==='NULL'||s==='-') return null;
    return s;
  }

  /* --- case-insensitive column lookup so SELECT * ordering never matters --- */
  function col(row,names){
    const keys=Object.keys(row||{});
    for(const n of names){
      const k=keys.find(x=>x.toLowerCase()===n.toLowerCase());
      if(k!==undefined){
        const v=clean(row[k]);
        if(v!==null) return v;
      }
    }
    return null;
  }

  function numeric(v,fallback){
    if(v===undefined||v===null||v==='') return fallback;
    const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));
    return isNaN(n)?fallback:n;
  }

  /* --- map dbo.GlobalMeasures rows onto the dashboard record shape --- */
  function mapRows(rows){
    const recs=[];
    (rows||[]).forEach(row=>{
      const pillar  = col(row,['Pillar','Section','Title']);
      const measure = col(row,['Measure','MeasureName']);
      const yearRaw = col(row,['MeasureYear','Year']);
      if(!pillar||!measure||yearRaw==null) return;

      const year=parseInt(String(yearRaw).replace(/[^0-9]/g,''));
      if(isNaN(year)) return;

      const sec=String(pillar).trim();
      recs.push({
        section : sec,
        measure : String(measure).trim(),
        year    : year,
        actual  : col(row,['ActualValue','Actual']),
        goal    : col(row,['TargetValue','Goal','Target']),
        color   : SECTION_COLORS[sec]||'#808285',
        sort    : numeric(col(row,['MeasureSort','SortOrder']),9999),
        yearSort: numeric(col(row,['YearSort']),9999),
        id      : numeric(col(row,['GlobalMeasureID']),null)
      });
    });

    // pillar order first, then MeasureSort, then year -> keeps cards in scorecard order
    recs.sort((a,b)=>{
      const pa=SECTION_ORDER.indexOf(a.section), pb=SECTION_ORDER.indexOf(b.section);
      return ((pa<0?99:pa)-(pb<0?99:pb))
          || (a.sort-b.sort)
          || (a.year-b.year)
          || a.measure.localeCompare(b.measure);
    });
    return recs;
  }

  function build(recs){
    // pillars actually present, in the canonical order, then any extras
    const present=[...new Set(recs.map(r=>r.section))];
    const order=SECTION_ORDER.filter(s=>present.includes(s))
                .concat(present.filter(s=>!SECTION_ORDER.includes(s)));
    const colors={};
    order.forEach((s,i)=>{ colors[s]=SECTION_COLORS[s]||['#005A9C','#00A8CD','#7DB045','#D73647','#F8991D'][i%5]; });
    const years=[...new Set(recs.map(r=>r.year))].sort((a,b)=>a-b);
    return {sectionOrder:order,pillarColors:colors,records:recs,years:years};
  }

  function apply(recs,label){
    DB=build(recs);
    App.reload();
    setStatus('live','<b>Live</b> &middot; '+recs.length+' rows &middot; '+label+' '+new Date().toLocaleTimeString());
  }

  function fallback(msg){
    DB=DB_SNAPSHOT;
    App.reload();
    setStatus('cached','Cached snapshot &middot; '+msg);
  }

  /* --- 1) read the JSON Flask rendered into the page --- */
  function loadInjected(){
    setStatus('loading','Reading SQL payload&hellip;');
    const el=document.getElementById('sqlData');
    if(!el){ fallback('no #sqlData block in the template'); return false; }
    const raw=(el.textContent||'').trim();
    // if the page was opened directly the Jinja tag is still literal ("{" + "{ metrics_json ...")
    const OPEN='{'+'{';
    if(!raw||raw==='null'||raw.indexOf(OPEN)===0){
      fallback('serve this page through Flask so metrics_json is rendered');
      return false;
    }
    try{
      const payload=JSON.parse(raw);
      const rows=Array.isArray(payload)?payload:(payload.records||payload.data||payload.value||[]);
      const recs=mapRows(rows);
      if(!recs.length){ fallback('SQL payload contained no usable rows &mdash; check column names'); return false; }
      apply(recs,'loaded');
      return true;
    }catch(e){
      console.warn('[GlobalMeasures] could not parse injected JSON',e);
      fallback('injected JSON could not be parsed (see console)');
      return false;
    }
  }

  /* --- 2) re-query on demand through the Flask API --- */
  async function refresh(manual=true){
    setStatus('loading','Re-querying dbo.GlobalMeasures&hellip;');
    try{
      const res=await fetch(CONFIG.apiUrl,{cache:'no-store',headers:{'Accept':'application/json'}});
      if(!res.ok) throw new Error('HTTP '+res.status+' from '+CONFIG.apiUrl);
      const payload=await res.json();
      const rows=Array.isArray(payload)?payload:(payload.records||payload.data||payload.value||[]);
      const recs=mapRows(rows);
      if(!recs.length) throw new Error('API returned no usable rows');
      apply(recs,'refreshed');
    }catch(e){
      console.warn('[GlobalMeasures] refresh failed',e);
      setStatus('error','Refresh failed &middot; '+e.message+' &middot; showing last good data');
      if(manual) alert('Refresh failed: '+e.message+'\nAdd an /api/measures route to app.py, or reload the page.');
    }
  }

  function startAuto(){
    if(CONFIG.autoRefreshMinutes>0){
      clearInterval(timer);
      timer=setInterval(()=>refresh(false),CONFIG.autoRefreshMinutes*60000);
    }
  }

  return {loadInjected,refresh,startAuto,setStatus,mapRows,CONFIG};
})();
/* ============ BOOT ============ */
App.initControls();
App.render();
Chat.init();
Data.loadInjected();   // read the JSON Flask rendered into #sqlData (snapshot fallback)
Data.startAuto();
</script>
